<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Banner 03 · ウイニングライブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@500;700&family=Zen+Maru+Gothic:wght@700;900&display=block" rel="stylesheet">
<style>
  /* The victory concert: spotlights, a horseshoe marquee of bulbs, penlights in the eight gate colours. */
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; background: transparent; }
  svg { display: block; border-radius: 20px; }
  .dela { font-family: "Dela Gothic One", sans-serif; }
  .maru { font-family: "Zen Maru Gothic", sans-serif; }
  .tc { font-family: "Noto Sans TC", sans-serif; }
</style>
</head>
<body>
<svg id="s" width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090619"/><stop offset=".62" stop-color="#22104a"/><stop offset=".86" stop-color="#2d1257"/><stop offset="1" stop-color="#0d0720"/>
    </linearGradient>
    <radialGradient id="halo" cx="640" cy="215" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b04ae0" stop-opacity=".55"/><stop offset=".55" stop-color="#5a1f9e" stop-opacity=".25"/><stop offset="1" stop-color="#5a1f9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fd0"/><stop offset=".5" stop-color="#d7c4ff"/><stop offset="1" stop-color="#8fe9ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a6e"/><stop offset="1" stop-color="#120926"/>
    </linearGradient>
    <filter id="beam" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="bulb" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="star" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10 Z"/>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#halo)"/>

  <!-- spotlights -->
  <g style="mix-blend-mode: screen" filter="url(#beam)">
    <path d="M190 -20 L230 -20 L470 360 L250 360 Z" fill="#b59cf2" opacity=".28"/>
    <path d="M430 -20 L462 -20 L640 360 L500 360 Z" fill="#ff8ccf" opacity=".22"/>
    <path d="M818 -20 L850 -20 L780 360 L640 360 Z" fill="#8fe9ff" opacity=".22"/>
    <path d="M1050 -20 L1090 -20 L1030 360 L810 360 Z" fill="#ffd36b" opacity=".22"/>
  </g>

  <!-- stage floor with reflections -->
  <path d="M0 338 H1280 V400 H0 Z" fill="url(#floor)"/>
  <path d="M0 338 H1280" stroke="#c9a6ff" stroke-width="2" opacity=".7"/>
  <g filter="url(#blur)" opacity=".5">
    <ellipse cx="380" cy="356" rx="80" ry="8" fill="#b59cf2"/><ellipse cx="580" cy="358" rx="70" ry="7" fill="#ff8ccf"/>
    <ellipse cx="720" cy="358" rx="70" ry="7" fill="#8fe9ff"/><ellipse cx="920" cy="356" rx="80" ry="8" fill="#ffd36b"/>
  </g>

  <!-- horseshoe marquee -->
  <path d="M420 338 V240 A220 220 0 0 1 860 240 V338" fill="none" stroke="#2a1252" stroke-width="30" stroke-linecap="round"/>
  <path d="M420 338 V240 A220 220 0 0 1 860 240 V338" fill="none" stroke="#e7b94c" stroke-width="2" opacity=".85"/>
  <g id="bulbs" fill="#ffe7a3" filter="url(#bulb)"></g>

  <g id="confetti"></g>

  <!-- title inside the marquee -->
  <g text-anchor="middle">
    <text x="640" y="160" class="maru" font-weight="900" font-size="17" fill="#ffe7a3" letter-spacing="6">♪ WINNING LIVE ♪</text>
    <text x="640" y="236" class="dela" font-size="70" fill="url(#title)" stroke="#fff" stroke-width="2.5" paint-order="stroke" filter="url(#neon)" letter-spacing="1">TRACEN</text>
    <text x="640" y="272" class="dela" font-size="24" fill="#fff" letter-spacing="13">ACADEMY</text>
    <text x="640" y="308" class="maru" font-weight="700" font-size="20" fill="#e9dcff" letter-spacing="4">トレセン学園 校務情報システム</text>
  </g>
  <g fill="#fff" filter="url(#bulb)">
    <use href="#star" transform="translate(500 120) scale(.9)"/><use href="#star" transform="translate(790 128) scale(1.2)"/>
    <use href="#star" transform="translate(560 84) scale(.5)"/><use href="#star" transform="translate(735 92) scale(.6)"/>
  </g>

  <!-- set list (left) -->
  <g transform="translate(56 70)">
    <text class="dela" font-size="15" fill="#ff8fd0" letter-spacing="5">SET LIST</text>
    <path d="M0 14 H200" stroke="#ff8fd0" stroke-width="1" opacity=".6"/>
    <g class="tc" font-size="16" font-weight="500" fill="#efe6ff" id="setlist"></g>
  </g>

  <!-- starring (right) -->
  <g transform="translate(1224 70)" text-anchor="end">
    <text class="dela" font-size="15" fill="#8fe9ff" letter-spacing="5">STARRING</text>
    <path d="M-200 14 H0" stroke="#8fe9ff" stroke-width="1" opacity=".6"/>
    <text y="52" class="maru" font-weight="900" font-size="30" fill="#fff">駿川たづな</text>
    <text y="78" class="maru" font-weight="700" font-size="14" fill="#c9b8f0" letter-spacing="2">AI Secretary · Hayakawa Tazuna</text>
    <text y="128" class="dela" font-size="13" fill="#ffe7a3" letter-spacing="4">BACK BAND</text>
    <g class="maru" font-weight="700" font-size="14" fill="#e9dcff" letter-spacing="1">
      <text y="152">Rust · axum · PostgreSQL</text>
      <text y="174">React · Vite · i18next</text>
      <text y="196">Gemini · three-vrm</text>
    </g>
  </g>

  <!-- crowd with penlights -->
  <g id="crowd"></g>
</svg>
<script>
  // Seeded layout so every render is the same.
  let seed = 20261026;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  // Bulbs along the horseshoe: legs and the half circle.
  const bulbs = document.getElementById("bulbs");
  const pts = [];
  for (let y = 330; y > 240; y -= 22) { pts.push([420, y]); pts.push([860, y]); }
  for (let a = 180; a >= 0; a -= 8.2) { const r = a * Math.PI / 180; pts.push([640 + 220 * Math.cos(r), 240 - 220 * Math.sin(r)]); }
  pts.forEach(([x, y]) => el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 4.2 }, bulbs));

  // Set list.
  const songs = ["校務資訊", "校務日曆", "訓練設施", "訓練計畫試算", "理事長室（真人）", "三語介面", "３Ｄ角色"];
  const list = document.getElementById("setlist");
  songs.forEach((t, i) => {
    const row = el("text", { y: 42 + i * 24 }, list);
    const n = el("tspan", { fill: "#ff8fd0", "font-weight": 700 }, row); n.textContent = String(i + 1).padStart(2, "0") + "  ";
    const s = el("tspan", {}, row); s.textContent = t;
  });

  // Confetti in the upper half, kept off the text blocks.
  const conf = document.getElementById("confetti");
  const clear = [[40, 50, 340, 270], [940, 50, 1250, 290], [450, 120, 830, 320]];
  const onText = (x, y) => clear.some(([x0, y0, x1, y1]) => x > x0 && x < x1 && y > y0 && y < y1);
  const cc = ["#ffe7a3", "#ff8fd0", "#ffffff", "#8fe9ff", "#c9a6ff"];
  for (let i = 0; i < 90; i++) {
    const x = rnd() * 1280, y = rnd() * 300, w = 3 + rnd() * 5, h = 6 + rnd() * 8;
    if (onText(x, y)) continue;
    el("rect", { x: x.toFixed(1), y: y.toFixed(1), width: w.toFixed(1), height: h.toFixed(1), fill: cc[i % cc.length], opacity: (0.45 + rnd() * 0.45).toFixed(2),
      transform: `rotate(${(rnd() * 360).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})` }, conf);
  }

  // Crowd: heads along the bottom edge, penlights in the eight gate colours.
  const crowd = document.getElementById("crowd");
  const waku = ["#ffffff", "#9a8cff", "#ff5a4f", "#4f8dff", "#ffd84a", "#45d47a", "#ff9a3d", "#ff8fc8"];
  const lights = el("g", { filter: "url(#bulb)" }, crowd);
  for (let x = -10; x < 1300; x += 26 + rnd() * 10) {
    const y = 392 + rnd() * 10, r = 15 + rnd() * 5;
    if (rnd() < 0.62) {
      const ang = -35 + rnd() * 70, len = 30 + rnd() * 12;
      el("rect", { x: (x - 2.5).toFixed(1), y: (y - r - len).toFixed(1), width: 5, height: len.toFixed(1), rx: 2.5, fill: waku[Math.floor(rnd() * 8)],
        transform: `rotate(${ang.toFixed(0)} ${x.toFixed(1)} ${(y - r).toFixed(1)})` }, lights);
    }
    el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(1), fill: "#06030e" }, crowd);
  }
</script>
</body>
</html>
