<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Banner 05 · 着順掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=block" rel="stylesheet">
<style>
  /* The racecourse result board: dot-matrix LEDs, the red 確定 lamp, the features as the placed runners. */
  :root { --amber: #ffb22e; --red: #ff5a36; --green: #49f08b; --white: #f3efe4; --dim: #6d6a74; }
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; background: transparent; }
  .bezel { position: relative; width: 1280px; height: 400px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, #3a3f48, #23262d 55%, #1a1c21); font-family: "DotGothic16", monospace; }
  .rivet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9aa0aa, #4a4f58 70%); box-shadow: 0 1px 1px #0008; }
  .board { position: absolute; inset: 22px; border-radius: 10px; background-color: #08090b;
    background-image: radial-gradient(circle, rgb(255 255 255 / .05) 1px, transparent 1.5px); background-size: 6px 6px;
    box-shadow: inset 0 0 0 2px #000, inset 0 0 40px #000; }
  .led { text-shadow: 0 0 4px currentColor, 0 0 14px currentColor; }
  .amber { color: var(--amber); } .red { color: var(--red); } .green { color: var(--green); } .white { color: var(--white); }

  .left { position: absolute; left: 50px; top: 30px; width: 520px; }
  .head { display: flex; align-items: center; gap: 16px; font-size: 26px; }
  .head .race { font-size: 44px; line-height: 1; }
  .lamp { margin-left: auto; padding: 6px 14px 4px; border-radius: 6px; background: #ff3b30; color: #fff; font-size: 26px; letter-spacing: .1em;
    box-shadow: 0 0 10px #ff3b30, 0 0 26px #ff3b3088; }
  .title { margin-top: 26px; font-size: 46px; letter-spacing: .06em; line-height: 1.05; }
  .sub { margin-top: 14px; font-size: 26px; letter-spacing: .12em; }
  .who { margin-top: 8px; font-size: 22px; letter-spacing: .1em; }
  .en { margin-top: 10px; font-size: 15px; letter-spacing: .08em; opacity: .85; }

  .ticker { position: absolute; left: 44px; right: 44px; bottom: 18px; height: 40px; border-top: 1px solid #2a2c31; display: flex; align-items: center; gap: 14px; font-size: 19px; letter-spacing: .08em; white-space: nowrap; overflow: hidden; }
  .ticker .tag { color: #08090b; background: var(--amber); padding: 2px 8px 0; border-radius: 3px; text-shadow: none; box-shadow: 0 0 10px #ffb22e88; }

  .table { position: absolute; left: 640px; top: 30px; width: 590px; }
  .row { display: grid; grid-template-columns: 56px 74px 1fr 120px; align-items: center; height: 42px; border-bottom: 1px solid #1d1f24; font-size: 28px; }
  .row.hdr { height: 26px; font-size: 14px; color: var(--dim); letter-spacing: .2em; border-bottom-color: #2a2c31; }
  .row .num { display: flex; align-items: center; gap: 8px; }
  .chip { width: 10px; height: 26px; border-radius: 2px; }
  .row .t { text-align: right; }
</style>
</head>
<body>
<div class="bezel">
  <span class="rivet" style="left:7px;top:7px"></span><span class="rivet" style="right:7px;top:7px"></span>
  <span class="rivet" style="left:7px;bottom:7px"></span><span class="rivet" style="right:7px;bottom:7px"></span>
  <div class="board">
    <div class="left">
      <div class="head"><span class="led white">府中</span><span class="led amber race">11R</span><span class="led green">芝 2400</span><span class="lamp">確定</span></div>
      <div class="title led white">TRACEN ACADEMY</div>
      <div class="sub led amber">校務情報システム</div>
      <div class="who led green">AI秘書 駿川たづな</div>
      <div class="en led white">Administrative Information System</div>
    </div>

    <div class="table">
      <div class="row hdr"><span>着順</span><span>馬番</span><span>馬名</span><span class="t">タイム・着差</span></div>
      <div class="row"><span class="led red">1</span><span class="num"><i class="chip" style="background:#2f8f4e"></i><span class="led amber">6</span></span><span class="led green">駿川たづな</span><span class="led amber t">2:22.6</span></div>
      <div class="row"><span class="led red">2</span><span class="num"><i class="chip" style="background:#f3efe4"></i><span class="led amber">1</span></span><span class="led white">校務情報</span><span class="led amber t">1/2</span></div>
      <div class="row"><span class="led red">3</span><span class="num"><i class="chip" style="background:#2563b8"></i><span class="led amber">4</span></span><span class="led white">訓練計画</span><span class="led amber t">クビ</span></div>
      <div class="row"><span class="led red">4</span><span class="num"><i class="chip" style="background:#d23b33"></i><span class="led amber">3</span></span><span class="led white">施設予約</span><span class="led amber t">ハナ</span></div>
      <div class="row"><span class="led red">5</span><span class="num"><i class="chip" style="background:#f2cf3a"></i><span class="led amber">5</span></span><span class="led white">理事長室</span><span class="led amber t">3</span></div>
    </div>

    <div class="ticker"><span class="tag">INFO</span><span class="led amber">本日の校務はすべて確定しました。トレーナーさん、お疲れさまでした ♪</span></div>
  </div>
</div>
</body>
</html>
